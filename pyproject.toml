[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research"
version = "0.1.0"
description = "Decision Models Research & Analysis: reproducible studies on public data"
requires-python = ">=3.10"
# The studies run on the Valuation Model's tested engine, pinned in ENGINE so every result
# names the exact engine that produced it. The engine reads configs from its own repo, so it
# is installed from a checkout (scripts/setup_engine.sh), not from a wheel. Stdlib-only otherwise.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# rendering the study notebooks (Quarto itself is installed separately)
notebooks = ["jupyter>=1", "nbformat>=5", "pandas>=2", "plotly>=5.24"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["research*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
