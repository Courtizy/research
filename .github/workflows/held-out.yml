# The held-out test of Study 01 (plan: docs/preregistration/forecast-accuracy-held-out.md).
# Fetches Study 01's companies (the ranges' calibration) and the held-out sample from the SEC, then scores it.
# Needs the repository Actions secret (or variable) SEC_USER_AGENT ("Your Name you@example.com").
# A run with "limit" set is a plumbing check and is never committed.
name: Held-out test

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N held-out companies (plumbing check; blank = all)"
        required: false
      commit:
        description: "Commit the results to this branch (full runs only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the run records the commit that added the written plan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/setup_engine.sh
      - run: pip install -e ".[dev]"
      - name: Run the held-out test
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: python scripts/run_held_out.py ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: held_out
          path: site/data/held_out.json
      - name: Commit the results to this branch
        if: ${{ inputs.commit && !inputs.limit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/held_out.json
          git diff --cached --quiet || git commit -m "Held-out test results from run ${{ github.run_id }}"
          git push
