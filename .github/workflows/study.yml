# Re-runs a study from the SEC on demand and uploads the result for review.
# The SEC asks for a contact User-Agent. It is public contact info, not a credential, so it is set here;
# a repository secret SEC_USER_AGENT overrides it.
# Runs Study 01 from the SEC, then the calibration tables from the same panels.
# With "commit" ticked, the results are also committed to the branch the run was started on (open a PR from it to publish).
name: Study

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N companies (blank = all)"
        required: false
      commit:
        description: "Commit the results to this branch"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/setup_engine.sh
      - run: pip install -e ".[dev]"
      - name: Run the forecast-accuracy study
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Jason Courtoy courtizy@gmail.com' }}
        run: python scripts/run_forecast_accuracy.py ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      - name: Calibration tables for the Valuation Model
        run: python scripts/calibrate_revenue_errors.py
      - uses: actions/upload-artifact@v4
        with:
          name: forecast_accuracy
          path: |
            site/data/forecast_accuracy.json
            site/data/calibration/
      - name: Commit the results to this branch
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/forecast_accuracy.json site/data/calibration/
          git diff --cached --quiet || git commit -m "Study 01 results from run ${{ github.run_id }}"
          git push
