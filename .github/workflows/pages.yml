# Deploys site/ to GitHub Pages. Settings > Pages > Source must be "GitHub Actions".
# Results are the committed site/data/*.json; this workflow tests and publishes, it doesn't re-run studies.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/setup_engine.sh
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python scripts/export_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
